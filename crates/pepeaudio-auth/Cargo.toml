[package]
name = "pepeaudio-auth"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish = false

[dependencies]
axum = { version = "=0.8.9", features = ["http1", "json", "query", "tokio"] }
base64 = "0.22"
futures-util = { version = "0.3", default-features = false, features = ["std"] }
getrandom = "0.3"
pepeaudio-api = { path = "../pepeaudio-api" }
pepeaudio-core = { path = "../pepeaudio-core" }
redis = { version = "=1.5.0", default-features = false, features = [
    "connection-manager",
    "script",
    "tokio-comp",
    "tokio-rustls-comp",
] }
reqwest = { version = "=0.12.28", default-features = false, features = ["rustls-tls", "stream"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
subtle = "2.6"
thiserror = "2"
tokio = { version = "=1.53.1", features = ["macros", "rt-multi-thread", "sync", "time"] }
url = "2"
zeroize = { version = "1", features = ["derive"] }

[dev-dependencies]
http-body-util = "=0.1.3"
tower = { version = "=0.5.2", features = ["util"] }

[lints]
workspace = true
