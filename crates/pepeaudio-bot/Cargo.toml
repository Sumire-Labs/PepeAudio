[package]
name = "pepeaudio-bot"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish = false

[dependencies]
async-trait = "0.1"
base64 = "0.22"
futures-util = "0.3"
hmac = "0.12"
pepeaudio-components-v2 = { path = "../pepeaudio-components-v2" }
pepeaudio-catalog = { path = "../pepeaudio-catalog" }
pepeaudio-config = { path = "../pepeaudio-config" }
pepeaudio-core = { path = "../pepeaudio-core" }
pepeaudio-hrir = { path = "../pepeaudio-hrir" }
pepeaudio-media = { path = "../pepeaudio-media" }
pepeaudio-pipeline = { path = "../pepeaudio-pipeline" }
pepeaudio-player = { path = "../pepeaudio-player" }
pepeaudio-presets = { path = "../pepeaudio-presets" }
pepeaudio-runtime = { path = "../pepeaudio-runtime" }
pepeaudio-storage = { path = "../pepeaudio-storage" }
poise = { version = "=0.6.2", default-features = false, features = ["cache", "handle_panics"] }
serde_json.workspace = true
serenity = { version = "=0.12.5", default-features = false, features = ["builder", "cache", "client", "gateway", "http", "model", "native_tls_backend"] }
sha2 = "0.10"
songbird = { version = "=0.6.0", default-features = false, features = ["driver", "gateway", "native", "serenity", "tungstenite"] }
sysinfo = { version = "=0.39.6", default-features = false, features = ["system"] }
thiserror.workspace = true
time = "0.3"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "signal", "sync", "time"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
url = "2"
uuid.workspace = true

[dev-dependencies]
tokio = { version = "1", features = ["test-util"] }

[lints]
workspace = true
