[package]
name = "pepeaudio-pipeline"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish = false

[dependencies]
async-trait = "0.1"
pepeaudio-audio = { path = "../pepeaudio-audio" }
pepeaudio-core = { path = "../pepeaudio-core" }
pepeaudio-media = { path = "../pepeaudio-media" }
pepeaudio-player = { path = "../pepeaudio-player" }
serenity = { version = "=0.12.5", default-features = false, features = ["model", "native_tls_backend"] }
songbird = { version = "=0.6.0", default-features = false, features = ["driver", "gateway", "native", "serenity", "tungstenite"] }
symphonia = { version = "=0.5.5", default-features = false, features = ["pcm"] }
thiserror.workspace = true
tokio = { version = "1", features = ["fs", "io-util", "macros", "process", "rt-multi-thread", "sync", "time"] }
tracing = "0.1"
uuid.workspace = true

[dev-dependencies]
hound.workspace = true
pepeaudio-hrir = { path = "../pepeaudio-hrir" }

[lints]
workspace = true
